# mihomo (Clash.Meta) 配置模板 —— 旁路由透明代理用。
#
# 首次使用：把 `proxies` 换成你自己的订阅节点，或在 Web Dashboard 里导入订阅。
# Dashboard: https://d.metacubex.one  （后端填 http://192.168.1.5:9090）

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false

external-controller: 0.0.0.0:9090
secret: ""

# TUN 模式：旁路由透明代理
tun:
  enable: true
  stack: system
  dns-hijack: []
  auto-route: true
  auto-detect-interface: true

# TODO: 在这里填你的订阅节点，或通过 Dashboard 导入
proxies: []

# 首次先空着，代理节点和分组通过 Dashboard（metacubexd）导入/添加即可。
proxy-groups: []

rules:
  - MATCH,DIRECT
