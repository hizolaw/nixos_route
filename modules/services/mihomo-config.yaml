# mihomo (Clash.Meta) 配置模板 —— 旁路由透明代理用。
#
# 首次启动的直连配置；通过 MetaCubeXD Server WebUI 导入订阅。
# API 地址、secret 和 mixed port 由服务端管理。

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false

external-controller: 0.0.0.0:9090
secret: ""

# 内置 DNS：直接给 LAN 客户端用，也用于 TUN 透明代理解析
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# TUN 模式：旁路由透明代理
tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

# Subscriptions are intentionally managed through the dashboard and are not
# pinned in this repository.
proxies: []
proxy-groups: []

rules:
  - MATCH,DIRECT
